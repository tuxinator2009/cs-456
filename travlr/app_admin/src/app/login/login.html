<div class="row">
  <div class="col-12 col-md-8">
    <h2>Login</h2>

    <form
      #loginForm="ngForm"
      (ngSubmit)="onLoginSubmit()"
      novalidate
      >
      <div
        *ngIf="formError"
        role="alert"
        class="alert alert-danger"
        >
        {{ formError }}
      </div>

      <div class="form-group">
        <label for="name">Name</label>

        <input
          type="text"
          class="form-control"
          id="name"
          name="name"
          placeholder="Enter name"
          autocomplete="name"
          required
          [(ngModel)]="credentials.name"
          >
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="Enter email address"
              autocomplete="email"
              required
              [(ngModel)]="credentials.email"
              >
              </div>

              <div class="form-group">
                <label for="password">Password</label>

                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="Enter password"
                  autocomplete="current-password"
                  required
                  [(ngModel)]="credentials.password"
                  >
                  </div>

                  <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="submitted || loginForm.invalid"
                    >
                    <span *ngIf="!submitted">Sign In</span>
                    <span *ngIf="submitted">Signing In...</span>
                  </button>
                </form>
              </div>
            </div>
