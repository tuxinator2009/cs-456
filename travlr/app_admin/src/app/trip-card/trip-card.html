<div class="card">
  <div class="card-header">
    {{ trip.name }}
  </div>

  <img
    src="assets/images/{{ trip.image }}"
    [alt]="trip.name + ' trip thumbnail'"
    class="card-img-top"
  >

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} for
      {{ trip.perPerson | currency:'USD':'symbol' }}
      per person
    </p>

    <p
      class="card-text"
      [innerHTML]="trip.description"
    ></p>

    <div
  *ngIf="isLoggedIn()"
  class="trip-actions"
>
  <button
    type="button"
    class="btn btn-primary"
    (click)="bookTrip(trip)"
  >
    Book Trip
  </button>

  <button
    *ngIf="isAdmin()"
    type="button"
    class="btn btn-info"
    (click)="editTrip(trip)"
  >
    Edit Trip
  </button>
</div>
  </div>
</div>
