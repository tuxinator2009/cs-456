<section
  class="trip-search"
  aria-labelledby="trip-search-heading"
  >
  <div class="search-header">
    <div>
      <h2 id="trip-search-heading">Find a Trip</h2>
      <p>
        Search and filter available travel packages.
      </p>
    </div>

    <button
      *ngIf="isLoggedIn()"
      type="button"
      class="btn btn-info"
      (click)="addTrip()"
      >
      Add Trip
    </button>
  </div>

  <form
    class="search-grid"
    (ngSubmit)="searchTrips()"
    >
    <div class="form-group keyword-field">
      <label for="keyword">Keyword</label>

      <input
        id="keyword"
        name="keyword"
        type="search"
        class="form-control"
        placeholder="Trip name, code, resort, or description"
        [(ngModel)]="criteria.keyword"
        >
        </div>

        <div class="form-group">
          <label for="resort">Resort</label>

          <input
            id="resort"
            name="resort"
            type="text"
            class="form-control"
            placeholder="Example: Blue Lagoon"
            [(ngModel)]="criteria.resort"
            >
            </div>

            <div class="form-group">
              <label for="minPrice">Minimum Price</label>

              <input
                id="minPrice"
                name="minPrice"
                type="number"
                class="form-control"
                min="0"
                step="0.01"
                [(ngModel)]="criteria.minPrice"
                >
                </div>

                <div class="form-group">
                  <label for="maxPrice">Maximum Price</label>

                  <input
                    id="maxPrice"
                    name="maxPrice"
                    type="number"
                    class="form-control"
                    min="0"
                    step="0.01"
                    [(ngModel)]="criteria.maxPrice"
                    >
                    </div>

                    <div class="form-group">
                      <label for="nights">Number of Nights</label>

                      <input
                        id="nights"
                        name="nights"
                        type="number"
                        class="form-control"
                        min="1"
                        step="1"
                        [(ngModel)]="criteria.nights"
                        >
                        </div>

                        <div class="form-group">
                          <label for="sort">Sort Results</label>

                          <select
                            id="sort"
                            name="sort"
                            class="form-control"
                            [(ngModel)]="criteria.sort"
                            >
                            <option
                              *ngFor="let option of sortOptions"
                              [ngValue]="option.value"
                              >
                              {{ option.label }}
                            </option>
                          </select>
                        </div>

                        <div class="search-actions">
                          <button
                            type="submit"
                            class="btn btn-primary"
                            [disabled]="isLoading"
                            >
                            {{ isLoading ? 'Searching...' : 'Search Trips' }}
                          </button>

                          <button
                            type="button"
                            class="btn btn-secondary"
                            [disabled]="isLoading"
                            (click)="clearSearch()"
                            >
                            Clear
                          </button>
                        </div>
                      </form>
                    </section>

                    <div
                      *ngIf="errorMessage"
                      class="alert alert-danger"
                      role="alert"
                      >
                      {{ errorMessage }}
                    </div>

                    <p
                      *ngIf="message && !errorMessage"
                      class="result-summary"
                      aria-live="polite"
                      >
                      {{ message }}
                    </p>

                    <div
                      *ngIf="isLoading"
                      class="loading-message"
                      aria-live="polite"
                      >
                      Loading trips...
                    </div>

                    <div
                      *ngIf="!isLoading && !errorMessage && trips.length === 0"
                      class="alert alert-info"
                      >
                      No trips matched the selected criteria.
                    </div>

                    <div
                      *ngIf="!isLoading"
                      class="row"
                      >
                      @for (trip of trips; track trip._id) {
                      <div class="col-md-4">
                        <app-trip-card
                          [trip]="trip"
                          class="card-deck mt-2"
                          ></app-trip-card>
                        </div>
                        }
                      </div>
